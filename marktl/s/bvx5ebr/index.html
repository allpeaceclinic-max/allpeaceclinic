<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>선교형 교회 — 변화하는 상황에서 교회 개척과 교회의 새로운 표현</title><meta name="description" content="국교회가 자기 근간인 전도구 체제의 위기를 스스로 진단하고, 교회법을 고쳐서라도 '교회의 새로운 표현'에 길을 터 준 보기 드문 공식 문서. 같은 장소에 산다는 것이 함께 사는 것을 뜻하지 않게 된 네트워크 사회에서, 교회를 출발점으로 삼으면 선교는 미궁에 빠지고 선교를 출발점으로 삼으면 교회를 찾게 된다는 한 문장이 20년 뒤 영국 교회의 66% 성장 통계로 검증됐다."><meta property="og:title" content="선교형 교회 — 변화하는 상황에서 교회 개척과 교회의 새로운 표현"><meta property="og:type" content="article"><meta property="og:url" content="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/선교형교회_잉글랜드성공회/"><meta property="og:description" content="국교회가 자기 근간인 전도구 체제의 위기를 스스로 진단하고, 교회법을 고쳐서라도 '교회의 새로운 표현'에 길을 터 준 보기 드문 공식 문서. 같은 장소에 산다는 것이 함께 사는 것을 뜻하지 않게 된 네트워크 사회에서, 교회를 출발점으로 삼으면 선교는 미궁에 빠지고 선교를 출발점으로 삼으면 교회를 찾게 된다는 한 문장이 20년 뒤 영국 교회의 66% 성장 통계로 검증됐다."><meta property="og:site_name" content="영닥터 아카이브"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="선교형 교회 — 변화하는 상황에서 교회 개척과 교회의 새로운 표현"><meta name="twitter:description" content="국교회가 자기 근간인 전도구 체제의 위기를 스스로 진단하고, 교회법을 고쳐서라도 '교회의 새로운 표현'에 길을 터 준 보기 드문 공식 문서. 같은 장소에 산다는 것이 함께 사는 것을 뜻하지 않게 된 네트워크 사회에서, 교회를 출발점으로 삼으면 선교는 미궁에 빠지고 선교를 출발점으로 삼으면 교회를 찾게 된다는 한 문장이 20년 뒤 영국 교회의 66% 성장 통계로 검증됐다."><meta http-equiv="refresh" content="0;url=https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/선교형교회_잉글랜드성공회/"><link rel="canonical" href="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/선교형교회_잉글랜드성공회/"></head><body><a href="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/선교형교회_잉글랜드성공회/">Redirecting…</a></body></html>
