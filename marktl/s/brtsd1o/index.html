<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>그리스도인은 인간을 어떻게 이해해야 하는가 — 닫힌의식을 알면 사람이 보인다</title><meta name="description" content="교회는 설명되지 않는 문제를 「영적」이라는 통에 넣고, 정신의학은 모르는 것을 「정신분열증」이라 불렀다. 정신과 의사인 저자는 두 쓰레기통을 나란히 놓고, 지금 이 순간 내가 의식하지 못하는 나의 부분 — 닫힌의식 — 을 아는 일이 어떻게 자기와 타인을 이해하는 길이 되는지 사례로 보여 준다. 은혜가 다 해주는가, 아니면 은혜 안에서 내가 참여해야 하는가. 이 책은 뒤쪽을 고른다."><meta property="og:title" content="그리스도인은 인간을 어떻게 이해해야 하는가 — 닫힌의식을 알면 사람이 보인다"><meta property="og:type" content="article"><meta property="og:url" content="https://wiki.youngdoctor.kr/marktl/그리스도인은인간을어떻게이해해야하는가_김진/"><meta property="og:description" content="교회는 설명되지 않는 문제를 「영적」이라는 통에 넣고, 정신의학은 모르는 것을 「정신분열증」이라 불렀다. 정신과 의사인 저자는 두 쓰레기통을 나란히 놓고, 지금 이 순간 내가 의식하지 못하는 나의 부분 — 닫힌의식 — 을 아는 일이 어떻게 자기와 타인을 이해하는 길이 되는지 사례로 보여 준다. 은혜가 다 해주는가, 아니면 은혜 안에서 내가 참여해야 하는가. 이 책은 뒤쪽을 고른다."><meta property="og:site_name" content="영닥터 아카이브"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="그리스도인은 인간을 어떻게 이해해야 하는가 — 닫힌의식을 알면 사람이 보인다"><meta name="twitter:description" content="교회는 설명되지 않는 문제를 「영적」이라는 통에 넣고, 정신의학은 모르는 것을 「정신분열증」이라 불렀다. 정신과 의사인 저자는 두 쓰레기통을 나란히 놓고, 지금 이 순간 내가 의식하지 못하는 나의 부분 — 닫힌의식 — 을 아는 일이 어떻게 자기와 타인을 이해하는 길이 되는지 사례로 보여 준다. 은혜가 다 해주는가, 아니면 은혜 안에서 내가 참여해야 하는가. 이 책은 뒤쪽을 고른다."><meta http-equiv="refresh" content="0;url=https://wiki.youngdoctor.kr/marktl/그리스도인은인간을어떻게이해해야하는가_김진/"><link rel="canonical" href="https://wiki.youngdoctor.kr/marktl/그리스도인은인간을어떻게이해해야하는가_김진/"></head><body><a href="https://wiki.youngdoctor.kr/marktl/그리스도인은인간을어떻게이해해야하는가_김진/">Redirecting…</a></body></html>
