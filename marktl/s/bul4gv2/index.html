<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>초기 기독교의 예배와 복음전도 — 잠긴 동산이 매력이었다</title><meta name="description" content="첫 세 세기의 교회는 대중 설교도 선교 조직도 없었고, 집사는 문 앞에서 '양인지 늑대인지' 가려 외부인을 막았다. 그런데도 교회는 자랐다. 크라이더는 그 비밀을 예배의 매력이 아니라 예배가 빚어낸 사람들에게서 찾는다. 3년의 신앙문답, 화해 없이는 드릴 수 없던 평화의 입맞춤, 21분짜리 대화식 설교가 어떻게 '왜 저렇게 사는가?'라는 질문을 낳았는지, 그리고 4세기에 그 구조가 어떻게 뒤집혔는지를 짧고 밀도 있게 보여 준다."><meta property="og:title" content="초기 기독교의 예배와 복음전도 — 잠긴 동산이 매력이었다"><meta property="og:type" content="article"><meta property="og:url" content="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/초기기독교의예배와복음전도_크라이더/"><meta property="og:description" content="첫 세 세기의 교회는 대중 설교도 선교 조직도 없었고, 집사는 문 앞에서 '양인지 늑대인지' 가려 외부인을 막았다. 그런데도 교회는 자랐다. 크라이더는 그 비밀을 예배의 매력이 아니라 예배가 빚어낸 사람들에게서 찾는다. 3년의 신앙문답, 화해 없이는 드릴 수 없던 평화의 입맞춤, 21분짜리 대화식 설교가 어떻게 '왜 저렇게 사는가?'라는 질문을 낳았는지, 그리고 4세기에 그 구조가 어떻게 뒤집혔는지를 짧고 밀도 있게 보여 준다."><meta property="og:site_name" content="영닥터 아카이브"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="초기 기독교의 예배와 복음전도 — 잠긴 동산이 매력이었다"><meta name="twitter:description" content="첫 세 세기의 교회는 대중 설교도 선교 조직도 없었고, 집사는 문 앞에서 '양인지 늑대인지' 가려 외부인을 막았다. 그런데도 교회는 자랐다. 크라이더는 그 비밀을 예배의 매력이 아니라 예배가 빚어낸 사람들에게서 찾는다. 3년의 신앙문답, 화해 없이는 드릴 수 없던 평화의 입맞춤, 21분짜리 대화식 설교가 어떻게 '왜 저렇게 사는가?'라는 질문을 낳았는지, 그리고 4세기에 그 구조가 어떻게 뒤집혔는지를 짧고 밀도 있게 보여 준다."><meta http-equiv="refresh" content="0;url=https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/초기기독교의예배와복음전도_크라이더/"><link rel="canonical" href="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/초기기독교의예배와복음전도_크라이더/"></head><body><a href="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/초기기독교의예배와복음전도_크라이더/">Redirecting…</a></body></html>
