<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>돈은 중요하다 — 성전에서 태어난 것</title><meta name="description" content="돈은 물물교환의 불편에서 태어나지 않았다. 인류학자들이 아무리 찾아도 그 전설적인 물물교환의 땅은 발견되지 않았다. 저자들이 제시하는 기원은 다른 곳이다 — 돈은 성전 안에서, 공동체 구성원 사이에 재화를 공정하게 분배하기 위해 만들어졌다. 그렇다면 19세기에 일어난 일은 돈에 윤리가 없었던 것이 아니라, 돈에서 윤리를 떼어낸 사건이 된다. 회복해야 할 것은 새로 만들 것이 아니라 원래 있던 것이다."><meta property="og:title" content="돈은 중요하다 — 성전에서 태어난 것"><meta property="og:type" content="article"><meta property="og:url" content="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/돈은중요하다_스티븐스림/"><meta property="og:description" content="돈은 물물교환의 불편에서 태어나지 않았다. 인류학자들이 아무리 찾아도 그 전설적인 물물교환의 땅은 발견되지 않았다. 저자들이 제시하는 기원은 다른 곳이다 — 돈은 성전 안에서, 공동체 구성원 사이에 재화를 공정하게 분배하기 위해 만들어졌다. 그렇다면 19세기에 일어난 일은 돈에 윤리가 없었던 것이 아니라, 돈에서 윤리를 떼어낸 사건이 된다. 회복해야 할 것은 새로 만들 것이 아니라 원래 있던 것이다."><meta property="og:site_name" content="영닥터 아카이브"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="돈은 중요하다 — 성전에서 태어난 것"><meta name="twitter:description" content="돈은 물물교환의 불편에서 태어나지 않았다. 인류학자들이 아무리 찾아도 그 전설적인 물물교환의 땅은 발견되지 않았다. 저자들이 제시하는 기원은 다른 곳이다 — 돈은 성전 안에서, 공동체 구성원 사이에 재화를 공정하게 분배하기 위해 만들어졌다. 그렇다면 19세기에 일어난 일은 돈에 윤리가 없었던 것이 아니라, 돈에서 윤리를 떼어낸 사건이 된다. 회복해야 할 것은 새로 만들 것이 아니라 원래 있던 것이다."><meta http-equiv="refresh" content="0;url=https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/돈은중요하다_스티븐스림/"><link rel="canonical" href="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/돈은중요하다_스티븐스림/"></head><body><a href="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/돈은중요하다_스티븐스림/">Redirecting…</a></body></html>
