<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>존 비비어의 동행 — 경외는 멀어지게 하는가, 가까이 가게 하는가</title><meta name="description" content="이스라엘은 금송아지를 바알이라 부르지 않았다. 그들은 그것을 ‘여호와’라 불렀다. 경외를 잃는 길은 하나님을 부정하는 것이 아니라 내게 익숙한 크기로 줄이는 것이다. 존 비비어는 에덴에서 성막과 성전을 지나 오순절까지 되풀이되는 한 패턴 — 거룩한 질서, 영광, 그리고 심판 — 을 따라가며, 두려움은 하나님을 멀리하게 하고 경외는 가까이 나아가게 한다고 말한다."><meta property="og:title" content="존 비비어의 동행 — 경외는 멀어지게 하는가, 가까이 가게 하는가"><meta property="og:type" content="article"><meta property="og:url" content="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/존비비어의동행_존비비어/"><meta property="og:description" content="이스라엘은 금송아지를 바알이라 부르지 않았다. 그들은 그것을 ‘여호와’라 불렀다. 경외를 잃는 길은 하나님을 부정하는 것이 아니라 내게 익숙한 크기로 줄이는 것이다. 존 비비어는 에덴에서 성막과 성전을 지나 오순절까지 되풀이되는 한 패턴 — 거룩한 질서, 영광, 그리고 심판 — 을 따라가며, 두려움은 하나님을 멀리하게 하고 경외는 가까이 나아가게 한다고 말한다."><meta property="og:site_name" content="영닥터 아카이브"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="존 비비어의 동행 — 경외는 멀어지게 하는가, 가까이 가게 하는가"><meta name="twitter:description" content="이스라엘은 금송아지를 바알이라 부르지 않았다. 그들은 그것을 ‘여호와’라 불렀다. 경외를 잃는 길은 하나님을 부정하는 것이 아니라 내게 익숙한 크기로 줄이는 것이다. 존 비비어는 에덴에서 성막과 성전을 지나 오순절까지 되풀이되는 한 패턴 — 거룩한 질서, 영광, 그리고 심판 — 을 따라가며, 두려움은 하나님을 멀리하게 하고 경외는 가까이 나아가게 한다고 말한다."><meta http-equiv="refresh" content="0;url=https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/존비비어의동행_존비비어/"><link rel="canonical" href="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/존비비어의동행_존비비어/"></head><body><a href="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/존비비어의동행_존비비어/">Redirecting…</a></body></html>
