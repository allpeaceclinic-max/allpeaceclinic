<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>도시 선교 — 땅 끝이 다가오는 통로, 파송의 교회</title><meta name="description" content="지금의 도시는 사탄의 왕국도 하나님 나라도 아닌 일반은총의 도시다. 교회는 도시에서 시작했다가 도시를 잃었고, 이제 땅 끝이 우리 곁으로 다가왔다. 도시를 전도의 대상으로만 볼 것인가, 공적 가치가 다시 짜이는 장으로 볼 것인가. 도심의 생태계에 그 옷과 언어를 입고 들어가 같이 살아가는 사람들, 이주민과 함께하는 교회, 한 도시를 위해 연합하는 교회들의 이야기를 1993년부터 2026년까지의 자료로 함께 읽는다."><meta property="og:title" content="도시 선교 — 땅 끝이 다가오는 통로, 파송의 교회"><meta property="og:type" content="article"><meta property="og:url" content="https://wiki.youngdoctor.kr/marktl/도시선교/"><meta property="og:description" content="지금의 도시는 사탄의 왕국도 하나님 나라도 아닌 일반은총의 도시다. 교회는 도시에서 시작했다가 도시를 잃었고, 이제 땅 끝이 우리 곁으로 다가왔다. 도시를 전도의 대상으로만 볼 것인가, 공적 가치가 다시 짜이는 장으로 볼 것인가. 도심의 생태계에 그 옷과 언어를 입고 들어가 같이 살아가는 사람들, 이주민과 함께하는 교회, 한 도시를 위해 연합하는 교회들의 이야기를 1993년부터 2026년까지의 자료로 함께 읽는다."><meta property="og:site_name" content="영닥터 아카이브"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="도시 선교 — 땅 끝이 다가오는 통로, 파송의 교회"><meta name="twitter:description" content="지금의 도시는 사탄의 왕국도 하나님 나라도 아닌 일반은총의 도시다. 교회는 도시에서 시작했다가 도시를 잃었고, 이제 땅 끝이 우리 곁으로 다가왔다. 도시를 전도의 대상으로만 볼 것인가, 공적 가치가 다시 짜이는 장으로 볼 것인가. 도심의 생태계에 그 옷과 언어를 입고 들어가 같이 살아가는 사람들, 이주민과 함께하는 교회, 한 도시를 위해 연합하는 교회들의 이야기를 1993년부터 2026년까지의 자료로 함께 읽는다."><meta http-equiv="refresh" content="0;url=https://wiki.youngdoctor.kr/marktl/도시선교/"><link rel="canonical" href="https://wiki.youngdoctor.kr/marktl/도시선교/"></head><body><a href="https://wiki.youngdoctor.kr/marktl/도시선교/">Redirecting…</a></body></html>
