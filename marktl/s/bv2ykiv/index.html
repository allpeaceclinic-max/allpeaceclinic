<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>경이로움에 사로잡혀 — 애즈베리 부흥 16일의 기록</title><meta name="description" content="2023년 2월 8일, 켄터키의 작은 대학에서 여느 때와 다름없는 채플이 끝난 뒤 몇몇 학생이 남아 기도했다. 그 자리가 372시간 동안 꺼지지 않았고, 인구 6천 명의 마을에 7만 명이 다녀갔다. 그런데 이 부흥에는 유명한 설교자도 찬양 인도자도 없었다. 역사학자가 3개월간 당사자들을 인터뷰해 쓴 이 책은, 성령의 일하심과 사람이 내린 결정들을 대립시키지 않고 나란히 놓는다. 모금하지 않기로 한 결정, 생중계를 거부한 결정, 그리고 스스로 끝을 공표한 결정까지."><meta property="og:title" content="경이로움에 사로잡혀 — 애즈베리 부흥 16일의 기록"><meta property="og:type" content="article"><meta property="og:url" content="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/경이로움에사로잡혀_마크R엘리엇/"><meta property="og:description" content="2023년 2월 8일, 켄터키의 작은 대학에서 여느 때와 다름없는 채플이 끝난 뒤 몇몇 학생이 남아 기도했다. 그 자리가 372시간 동안 꺼지지 않았고, 인구 6천 명의 마을에 7만 명이 다녀갔다. 그런데 이 부흥에는 유명한 설교자도 찬양 인도자도 없었다. 역사학자가 3개월간 당사자들을 인터뷰해 쓴 이 책은, 성령의 일하심과 사람이 내린 결정들을 대립시키지 않고 나란히 놓는다. 모금하지 않기로 한 결정, 생중계를 거부한 결정, 그리고 스스로 끝을 공표한 결정까지."><meta property="og:site_name" content="영닥터 아카이브"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="경이로움에 사로잡혀 — 애즈베리 부흥 16일의 기록"><meta name="twitter:description" content="2023년 2월 8일, 켄터키의 작은 대학에서 여느 때와 다름없는 채플이 끝난 뒤 몇몇 학생이 남아 기도했다. 그 자리가 372시간 동안 꺼지지 않았고, 인구 6천 명의 마을에 7만 명이 다녀갔다. 그런데 이 부흥에는 유명한 설교자도 찬양 인도자도 없었다. 역사학자가 3개월간 당사자들을 인터뷰해 쓴 이 책은, 성령의 일하심과 사람이 내린 결정들을 대립시키지 않고 나란히 놓는다. 모금하지 않기로 한 결정, 생중계를 거부한 결정, 그리고 스스로 끝을 공표한 결정까지."><meta http-equiv="refresh" content="0;url=https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/경이로움에사로잡혀_마크R엘리엇/"><link rel="canonical" href="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/경이로움에사로잡혀_마크R엘리엇/"></head><body><a href="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/경이로움에사로잡혀_마크R엘리엇/">Redirecting…</a></body></html>
