<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>전도가 먼저다 — 순서를 뒤집은 42일</title><meta name="description" content="우리는 신앙이 자라면 전도하게 된다고 배웠다. 이 책은 그 화살표를 뒤집는다. 두 저자가 42일에 걸쳐 증언하는 것은, 한 사람에게 말을 건 뒤에야 성경이 뜨거워지고 기도에 초점이 생겼다는 순서다. 전도를 못 하게 막는 것은 지식의 부족이 아니라 모를까 봐 생기는 두려움이고, 처방은 더 공부하는 것이 아니라 &quot;모르겠습니다, 함께 찾아봅시다&quot;라고 말하는 두 박자다. 그리고 이 책을 함께 쓴 두 사람 중 하나는, 다른 하나가 오래전에 '가망 없는 후보' 명단에 올려두었던 사람이다."><meta property="og:title" content="전도가 먼저다 — 순서를 뒤집은 42일"><meta property="og:type" content="article"><meta property="og:url" content="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/다음세대를위한관계전도법_스트로벨미텔버그/"><meta property="og:description" content="우리는 신앙이 자라면 전도하게 된다고 배웠다. 이 책은 그 화살표를 뒤집는다. 두 저자가 42일에 걸쳐 증언하는 것은, 한 사람에게 말을 건 뒤에야 성경이 뜨거워지고 기도에 초점이 생겼다는 순서다. 전도를 못 하게 막는 것은 지식의 부족이 아니라 모를까 봐 생기는 두려움이고, 처방은 더 공부하는 것이 아니라 &quot;모르겠습니다, 함께 찾아봅시다&quot;라고 말하는 두 박자다. 그리고 이 책을 함께 쓴 두 사람 중 하나는, 다른 하나가 오래전에 '가망 없는 후보' 명단에 올려두었던 사람이다."><meta property="og:site_name" content="영닥터 아카이브"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="전도가 먼저다 — 순서를 뒤집은 42일"><meta name="twitter:description" content="우리는 신앙이 자라면 전도하게 된다고 배웠다. 이 책은 그 화살표를 뒤집는다. 두 저자가 42일에 걸쳐 증언하는 것은, 한 사람에게 말을 건 뒤에야 성경이 뜨거워지고 기도에 초점이 생겼다는 순서다. 전도를 못 하게 막는 것은 지식의 부족이 아니라 모를까 봐 생기는 두려움이고, 처방은 더 공부하는 것이 아니라 &quot;모르겠습니다, 함께 찾아봅시다&quot;라고 말하는 두 박자다. 그리고 이 책을 함께 쓴 두 사람 중 하나는, 다른 하나가 오래전에 '가망 없는 후보' 명단에 올려두었던 사람이다."><meta http-equiv="refresh" content="0;url=https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/다음세대를위한관계전도법_스트로벨미텔버그/"><link rel="canonical" href="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/다음세대를위한관계전도법_스트로벨미텔버그/"></head><body><a href="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/다음세대를위한관계전도법_스트로벨미텔버그/">Redirecting…</a></body></html>
