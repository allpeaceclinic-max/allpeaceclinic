<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>하나님의 선교전략 — 복음은 사람이 아니라 관계망을 타고 건넌다</title><meta name="description" content="맥가브란은 신학 논쟁이 아니라 결산표에서 출발한다. 1세기 반이 지났는데 중국인의 1%, 일본인의 0.5%, 인도인의 2%뿐이다. 왜 같은 조건에서 어떤 곳은 빠르고 어떤 곳은 멈추는가. 헌신의 양도 방법의 질도 답이 아니었다. 남는 변수는 사회 단위였다 — 혼자 믿으면 추방당하고, 함께 믿으면 추방이 무력해진다. 그가 놓으라는 다리는 선교사가 건너는 길이 아니라 복음이 친족의 관계망을 타고 건너가는 통로다. 그리고 그 통찰은 곧장 예산표로 이어진다."><meta property="og:title" content="하나님의 선교전략 — 복음은 사람이 아니라 관계망을 타고 건넌다"><meta property="og:type" content="article"><meta property="og:url" content="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/하나님의선교전략_도널드맥가브란/"><meta property="og:description" content="맥가브란은 신학 논쟁이 아니라 결산표에서 출발한다. 1세기 반이 지났는데 중국인의 1%, 일본인의 0.5%, 인도인의 2%뿐이다. 왜 같은 조건에서 어떤 곳은 빠르고 어떤 곳은 멈추는가. 헌신의 양도 방법의 질도 답이 아니었다. 남는 변수는 사회 단위였다 — 혼자 믿으면 추방당하고, 함께 믿으면 추방이 무력해진다. 그가 놓으라는 다리는 선교사가 건너는 길이 아니라 복음이 친족의 관계망을 타고 건너가는 통로다. 그리고 그 통찰은 곧장 예산표로 이어진다."><meta property="og:site_name" content="영닥터 아카이브"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="하나님의 선교전략 — 복음은 사람이 아니라 관계망을 타고 건넌다"><meta name="twitter:description" content="맥가브란은 신학 논쟁이 아니라 결산표에서 출발한다. 1세기 반이 지났는데 중국인의 1%, 일본인의 0.5%, 인도인의 2%뿐이다. 왜 같은 조건에서 어떤 곳은 빠르고 어떤 곳은 멈추는가. 헌신의 양도 방법의 질도 답이 아니었다. 남는 변수는 사회 단위였다 — 혼자 믿으면 추방당하고, 함께 믿으면 추방이 무력해진다. 그가 놓으라는 다리는 선교사가 건너는 길이 아니라 복음이 친족의 관계망을 타고 건너가는 통로다. 그리고 그 통찰은 곧장 예산표로 이어진다."><meta http-equiv="refresh" content="0;url=https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/하나님의선교전략_도널드맥가브란/"><link rel="canonical" href="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/하나님의선교전략_도널드맥가브란/"></head><body><a href="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/하나님의선교전략_도널드맥가브란/">Redirecting…</a></body></html>
