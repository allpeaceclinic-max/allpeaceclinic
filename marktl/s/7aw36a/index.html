<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>성경적 상담학 — 래리 크랩</title><meta name="description" content="행복은 상담의 목표가 아니라 부산물이다. 임상심리학 훈련을 받은 래리 크랩이 내놓은 이 명제는 지금도 기독교 상담의 출발선을 다시 긋는다. 세속 심리학을 배제할 것인가 섞을 것인가의 양자택일 앞에서 그는 제3의 길 — 성경의 권위 아래 심사해 가져오는 '애굽의 약탈품' — 을 택했고, 인간의 두 결핍을 '중요성과 안전'이라 이름 붙였다. 밑줄과 여백의 손글씨를 따라 읽은 115쪽의 기록."><meta property="og:title" content="성경적 상담학 — 래리 크랩"><meta property="og:type" content="article"><meta property="og:url" content="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/성경적상담학_래리크랩/"><meta property="og:description" content="행복은 상담의 목표가 아니라 부산물이다. 임상심리학 훈련을 받은 래리 크랩이 내놓은 이 명제는 지금도 기독교 상담의 출발선을 다시 긋는다. 세속 심리학을 배제할 것인가 섞을 것인가의 양자택일 앞에서 그는 제3의 길 — 성경의 권위 아래 심사해 가져오는 '애굽의 약탈품' — 을 택했고, 인간의 두 결핍을 '중요성과 안전'이라 이름 붙였다. 밑줄과 여백의 손글씨를 따라 읽은 115쪽의 기록."><meta property="og:site_name" content="영닥터 아카이브"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="성경적 상담학 — 래리 크랩"><meta name="twitter:description" content="행복은 상담의 목표가 아니라 부산물이다. 임상심리학 훈련을 받은 래리 크랩이 내놓은 이 명제는 지금도 기독교 상담의 출발선을 다시 긋는다. 세속 심리학을 배제할 것인가 섞을 것인가의 양자택일 앞에서 그는 제3의 길 — 성경의 권위 아래 심사해 가져오는 '애굽의 약탈품' — 을 택했고, 인간의 두 결핍을 '중요성과 안전'이라 이름 붙였다. 밑줄과 여백의 손글씨를 따라 읽은 115쪽의 기록."><meta http-equiv="refresh" content="0;url=https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/성경적상담학_래리크랩/"><link rel="canonical" href="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/성경적상담학_래리크랩/"></head><body><a href="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/성경적상담학_래리크랩/">Redirecting…</a></body></html>
