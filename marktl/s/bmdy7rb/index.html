<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>어댑티브 리더십 3 · 시스템의 온도 — 갈등은 해결하는 것이 아니라 조율하는 것이다</title><meta name="description" content="진단이 끝났다면 이제 개입할 차례다. 그런데 이 책이 권하는 첫 행동은 '행동하지 않는 것'이다. 사람들은 책임이 자기에게 돌아오지 않는 해석을 고르고, 조직은 갈등을 덮는 사람에게 보상한다. 해석을 옮기고, 침묵으로 빈 곳을 만들고, 방 안의 온도를 재며 올리고 내리는 법 — 갈등을 없애지 않고 쓰는 법을 다룬 책의 독서 노트."><meta property="og:title" content="어댑티브 리더십 3 · 시스템의 온도 — 갈등은 해결하는 것이 아니라 조율하는 것이다"><meta property="og:type" content="article"><meta property="og:url" content="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/어댑티브리더십3_시스템의온도_하이페츠/"><meta property="og:description" content="진단이 끝났다면 이제 개입할 차례다. 그런데 이 책이 권하는 첫 행동은 '행동하지 않는 것'이다. 사람들은 책임이 자기에게 돌아오지 않는 해석을 고르고, 조직은 갈등을 덮는 사람에게 보상한다. 해석을 옮기고, 침묵으로 빈 곳을 만들고, 방 안의 온도를 재며 올리고 내리는 법 — 갈등을 없애지 않고 쓰는 법을 다룬 책의 독서 노트."><meta property="og:site_name" content="영닥터 아카이브"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="어댑티브 리더십 3 · 시스템의 온도 — 갈등은 해결하는 것이 아니라 조율하는 것이다"><meta name="twitter:description" content="진단이 끝났다면 이제 개입할 차례다. 그런데 이 책이 권하는 첫 행동은 '행동하지 않는 것'이다. 사람들은 책임이 자기에게 돌아오지 않는 해석을 고르고, 조직은 갈등을 덮는 사람에게 보상한다. 해석을 옮기고, 침묵으로 빈 곳을 만들고, 방 안의 온도를 재며 올리고 내리는 법 — 갈등을 없애지 않고 쓰는 법을 다룬 책의 독서 노트."><meta http-equiv="refresh" content="0;url=https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/어댑티브리더십3_시스템의온도_하이페츠/"><link rel="canonical" href="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/어댑티브리더십3_시스템의온도_하이페츠/"></head><body><a href="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/어댑티브리더십3_시스템의온도_하이페츠/">Redirecting…</a></body></html>
