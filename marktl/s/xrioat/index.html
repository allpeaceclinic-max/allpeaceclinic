<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>인터서브의 선교 역사 (1852~2020) — 권한을 내려놓을 때마다 새 문이 열렸다</title><meta name="description" content="1833년 런던의 오후 차 모임에서 시작된 여성 선교회가 168년 뒤 29개국 840명이 함께하는 공동체가 되었다. 이 책이 들려주는 성장의 비밀은 확장이 아니라 내려놓음이다. 선교회에서 협회로, 선교사에서 파트너로 이름을 바꿀 때마다 권한을 넘겼고, 그때마다 새로운 문이 열렸다. 인터서브코리아 30년의 거버넌스 실험까지 함께 읽는다."><meta property="og:title" content="인터서브의 선교 역사 (1852~2020) — 권한을 내려놓을 때마다 새 문이 열렸다"><meta property="og:type" content="article"><meta property="og:url" content="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/인터서브의선교역사/"><meta property="og:description" content="1833년 런던의 오후 차 모임에서 시작된 여성 선교회가 168년 뒤 29개국 840명이 함께하는 공동체가 되었다. 이 책이 들려주는 성장의 비밀은 확장이 아니라 내려놓음이다. 선교회에서 협회로, 선교사에서 파트너로 이름을 바꿀 때마다 권한을 넘겼고, 그때마다 새로운 문이 열렸다. 인터서브코리아 30년의 거버넌스 실험까지 함께 읽는다."><meta property="og:site_name" content="영닥터 아카이브"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="인터서브의 선교 역사 (1852~2020) — 권한을 내려놓을 때마다 새 문이 열렸다"><meta name="twitter:description" content="1833년 런던의 오후 차 모임에서 시작된 여성 선교회가 168년 뒤 29개국 840명이 함께하는 공동체가 되었다. 이 책이 들려주는 성장의 비밀은 확장이 아니라 내려놓음이다. 선교회에서 협회로, 선교사에서 파트너로 이름을 바꿀 때마다 권한을 넘겼고, 그때마다 새로운 문이 열렸다. 인터서브코리아 30년의 거버넌스 실험까지 함께 읽는다."><meta http-equiv="refresh" content="0;url=https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/인터서브의선교역사/"><link rel="canonical" href="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/인터서브의선교역사/"></head><body><a href="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/인터서브의선교역사/">Redirecting…</a></body></html>
