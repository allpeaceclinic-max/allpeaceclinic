<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>누가 그 진리를 죽였는가 — 레슬리 뉴비긴</title><meta name="description" content="근대는 하나님을 부인한 것이 아니라 법정을 옮겼다. 계시와 전통더러 개인의 이성 앞에서 자격을 증명하라고 한 순간, 아우구스티누스의 「알기 위해 믿는다」는 데카르트의 「의심에서 출발한다」로 뒤집혔고, 그 길은 회의주의를 지나 허무주의와 권력으로 갔다. 뉴비긴은 100쪽 남짓한 이 소책자에서 그 계보를 해부한 뒤, 예수가 책을 쓰지 않고 공동체·전통·성령에 가르침을 위탁했다는 사실에서 권위의 매개 방식을 다시 찾는다. 성경은 들여다보는 대상이 아니라 그 안에 살아야 하는 이야기이며, 복음은 의심할 수 없는 확실성이 아니라 믿음의 문제라는 그의 결론은 근본주의와 자유주의 양쪽을 동시에 불편하게 만든다."><meta property="og:title" content="누가 그 진리를 죽였는가 — 레슬리 뉴비긴"><meta property="og:type" content="article"><meta property="og:url" content="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/누가그진리를죽였는가_레슬리뉴비긴/"><meta property="og:description" content="근대는 하나님을 부인한 것이 아니라 법정을 옮겼다. 계시와 전통더러 개인의 이성 앞에서 자격을 증명하라고 한 순간, 아우구스티누스의 「알기 위해 믿는다」는 데카르트의 「의심에서 출발한다」로 뒤집혔고, 그 길은 회의주의를 지나 허무주의와 권력으로 갔다. 뉴비긴은 100쪽 남짓한 이 소책자에서 그 계보를 해부한 뒤, 예수가 책을 쓰지 않고 공동체·전통·성령에 가르침을 위탁했다는 사실에서 권위의 매개 방식을 다시 찾는다. 성경은 들여다보는 대상이 아니라 그 안에 살아야 하는 이야기이며, 복음은 의심할 수 없는 확실성이 아니라 믿음의 문제라는 그의 결론은 근본주의와 자유주의 양쪽을 동시에 불편하게 만든다."><meta property="og:site_name" content="영닥터 아카이브"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="누가 그 진리를 죽였는가 — 레슬리 뉴비긴"><meta name="twitter:description" content="근대는 하나님을 부인한 것이 아니라 법정을 옮겼다. 계시와 전통더러 개인의 이성 앞에서 자격을 증명하라고 한 순간, 아우구스티누스의 「알기 위해 믿는다」는 데카르트의 「의심에서 출발한다」로 뒤집혔고, 그 길은 회의주의를 지나 허무주의와 권력으로 갔다. 뉴비긴은 100쪽 남짓한 이 소책자에서 그 계보를 해부한 뒤, 예수가 책을 쓰지 않고 공동체·전통·성령에 가르침을 위탁했다는 사실에서 권위의 매개 방식을 다시 찾는다. 성경은 들여다보는 대상이 아니라 그 안에 살아야 하는 이야기이며, 복음은 의심할 수 없는 확실성이 아니라 믿음의 문제라는 그의 결론은 근본주의와 자유주의 양쪽을 동시에 불편하게 만든다."><meta http-equiv="refresh" content="0;url=https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/누가그진리를죽였는가_레슬리뉴비긴/"><link rel="canonical" href="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/누가그진리를죽였는가_레슬리뉴비긴/"></head><body><a href="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/누가그진리를죽였는가_레슬리뉴비긴/">Redirecting…</a></body></html>
