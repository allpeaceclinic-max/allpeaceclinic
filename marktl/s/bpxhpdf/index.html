<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>기독시민의 사회적 책임 — 교회는 어느 층위에서 말해야 하는가</title><meta name="description" content="'복지국가'라는 말을 처음 쓴 캔터베리 대주교가 전시 영국에서 던진 질문은 「교회가 사회에 개입해도 되는가」가 아니었다. 개입의 반대는 침묵이 아니라 층위 혼동이라는 것 — 교회는 원리를 선포하고 위배를 고발하되 정책은 시민과 전문가에게 맡긴다는, 80년이 지나도 낡지 않은 분업의 설계도다. 실업을 '도덕적 고립'으로, 소유를 '관리권'으로, 사랑을 '정의를 통해 먼저 표현되는 것'으로 다시 정의하며, 마지막에는 자기 제안에 스스로 사용 제한을 건다."><meta property="og:title" content="기독시민의 사회적 책임 — 교회는 어느 층위에서 말해야 하는가"><meta property="og:type" content="article"><meta property="og:url" content="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/기독시민의사회적책임_윌리엄템플/"><meta property="og:description" content="'복지국가'라는 말을 처음 쓴 캔터베리 대주교가 전시 영국에서 던진 질문은 「교회가 사회에 개입해도 되는가」가 아니었다. 개입의 반대는 침묵이 아니라 층위 혼동이라는 것 — 교회는 원리를 선포하고 위배를 고발하되 정책은 시민과 전문가에게 맡긴다는, 80년이 지나도 낡지 않은 분업의 설계도다. 실업을 '도덕적 고립'으로, 소유를 '관리권'으로, 사랑을 '정의를 통해 먼저 표현되는 것'으로 다시 정의하며, 마지막에는 자기 제안에 스스로 사용 제한을 건다."><meta property="og:site_name" content="영닥터 아카이브"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="기독시민의 사회적 책임 — 교회는 어느 층위에서 말해야 하는가"><meta name="twitter:description" content="'복지국가'라는 말을 처음 쓴 캔터베리 대주교가 전시 영국에서 던진 질문은 「교회가 사회에 개입해도 되는가」가 아니었다. 개입의 반대는 침묵이 아니라 층위 혼동이라는 것 — 교회는 원리를 선포하고 위배를 고발하되 정책은 시민과 전문가에게 맡긴다는, 80년이 지나도 낡지 않은 분업의 설계도다. 실업을 '도덕적 고립'으로, 소유를 '관리권'으로, 사랑을 '정의를 통해 먼저 표현되는 것'으로 다시 정의하며, 마지막에는 자기 제안에 스스로 사용 제한을 건다."><meta http-equiv="refresh" content="0;url=https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/기독시민의사회적책임_윌리엄템플/"><link rel="canonical" href="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/기독시민의사회적책임_윌리엄템플/"></head><body><a href="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/기독시민의사회적책임_윌리엄템플/">Redirecting…</a></body></html>
