<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>가난한 시대를 사는 부유한 그리스도인 — 자선이 아니라 정의를</title><meta name="description" content="1977년, 한 복음주의 신학자가 부유한 교회에게 불편한 질문을 던졌다. 기근은 식량이 모자라서가 아니라 돈 없는 사람에게만 온다면, 하나님은 그 굶주림 앞에서 중립이신가. 희년과 만나, 아모스와 삭개오를 따라 걸으며 사이더는 자선이 아니라 정의를, 개인의 검소함과 교회의 나눔과 사회의 구조를 함께 요구한다. 반세기가 지나도 여전히 읽는 사람을 불편하게 하는 고전이다."><meta property="og:title" content="가난한 시대를 사는 부유한 그리스도인 — 자선이 아니라 정의를"><meta property="og:type" content="article"><meta property="og:url" content="https://wiki.youngdoctor.kr/marktl/가난한시대를사는부유한그리스도인_로날드사이더/"><meta property="og:description" content="1977년, 한 복음주의 신학자가 부유한 교회에게 불편한 질문을 던졌다. 기근은 식량이 모자라서가 아니라 돈 없는 사람에게만 온다면, 하나님은 그 굶주림 앞에서 중립이신가. 희년과 만나, 아모스와 삭개오를 따라 걸으며 사이더는 자선이 아니라 정의를, 개인의 검소함과 교회의 나눔과 사회의 구조를 함께 요구한다. 반세기가 지나도 여전히 읽는 사람을 불편하게 하는 고전이다."><meta property="og:site_name" content="영닥터 아카이브"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="가난한 시대를 사는 부유한 그리스도인 — 자선이 아니라 정의를"><meta name="twitter:description" content="1977년, 한 복음주의 신학자가 부유한 교회에게 불편한 질문을 던졌다. 기근은 식량이 모자라서가 아니라 돈 없는 사람에게만 온다면, 하나님은 그 굶주림 앞에서 중립이신가. 희년과 만나, 아모스와 삭개오를 따라 걸으며 사이더는 자선이 아니라 정의를, 개인의 검소함과 교회의 나눔과 사회의 구조를 함께 요구한다. 반세기가 지나도 여전히 읽는 사람을 불편하게 하는 고전이다."><meta http-equiv="refresh" content="0;url=https://wiki.youngdoctor.kr/marktl/가난한시대를사는부유한그리스도인_로날드사이더/"><link rel="canonical" href="https://wiki.youngdoctor.kr/marktl/가난한시대를사는부유한그리스도인_로날드사이더/"></head><body><a href="https://wiki.youngdoctor.kr/marktl/가난한시대를사는부유한그리스도인_로날드사이더/">Redirecting…</a></body></html>
