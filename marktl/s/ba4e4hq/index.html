<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>숨겨진 상처의 치유 — 상처는 되돌릴 수 없어도 한은 풀 수 있다</title><meta name="description" content="굳은 길바닥, 바위 박힌 돌밭, 에너지를 빼앗는 가시덤불, 그리고 가면을 벗은 어린아이의 옥토. 한국 목회상담 1세대 정태기는 씨 뿌리는 자 비유로 우리 몸의 병 뒤에 숨은 마음의 상처를 진단하고, 프로이드와 아들러의 통찰을 일반은총의 선물로 받아 예수님의 치유로 잇는다. 「상처는 다시 원래의 상태로 돌이킬 수 없지만 한은 언제든지 풀어버릴 수 있습니다」라는 한 문장이 책 전체의 소망이다."><meta property="og:title" content="숨겨진 상처의 치유 — 상처는 되돌릴 수 없어도 한은 풀 수 있다"><meta property="og:type" content="article"><meta property="og:url" content="https://wiki.youngdoctor.kr/marktl/숨겨진상처의치유_정태기/"><meta property="og:description" content="굳은 길바닥, 바위 박힌 돌밭, 에너지를 빼앗는 가시덤불, 그리고 가면을 벗은 어린아이의 옥토. 한국 목회상담 1세대 정태기는 씨 뿌리는 자 비유로 우리 몸의 병 뒤에 숨은 마음의 상처를 진단하고, 프로이드와 아들러의 통찰을 일반은총의 선물로 받아 예수님의 치유로 잇는다. 「상처는 다시 원래의 상태로 돌이킬 수 없지만 한은 언제든지 풀어버릴 수 있습니다」라는 한 문장이 책 전체의 소망이다."><meta property="og:site_name" content="영닥터 아카이브"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="숨겨진 상처의 치유 — 상처는 되돌릴 수 없어도 한은 풀 수 있다"><meta name="twitter:description" content="굳은 길바닥, 바위 박힌 돌밭, 에너지를 빼앗는 가시덤불, 그리고 가면을 벗은 어린아이의 옥토. 한국 목회상담 1세대 정태기는 씨 뿌리는 자 비유로 우리 몸의 병 뒤에 숨은 마음의 상처를 진단하고, 프로이드와 아들러의 통찰을 일반은총의 선물로 받아 예수님의 치유로 잇는다. 「상처는 다시 원래의 상태로 돌이킬 수 없지만 한은 언제든지 풀어버릴 수 있습니다」라는 한 문장이 책 전체의 소망이다."><meta http-equiv="refresh" content="0;url=https://wiki.youngdoctor.kr/marktl/숨겨진상처의치유_정태기/"><link rel="canonical" href="https://wiki.youngdoctor.kr/marktl/숨겨진상처의치유_정태기/"></head><body><a href="https://wiki.youngdoctor.kr/marktl/숨겨진상처의치유_정태기/">Redirecting…</a></body></html>
