<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>날마다 하나님께로 더 가까이 — 하나님은 왜 친밀함을 강요하지 않으시는가</title><meta name="description" content="출애굽의 목적지는 젖과 꿀이 흐르는 땅이 아니라 「광야에서 나를 섬김」이었다. 하나님은 우리와 가까워지기를 갈망하시지만 결코 강요하지 않으신다 — 친밀함은 우리의 반응만큼 깊어진다. 에녹에서 다윗까지 동행한 사람들의 계보를 따라가며, 한 독자가 여백에 남긴 한 줄로 책 전체를 요약한다: 들음 → 믿음 → 확신 → 순종 → 친밀."><meta property="og:title" content="날마다 하나님께로 더 가까이 — 하나님은 왜 친밀함을 강요하지 않으시는가"><meta property="og:type" content="article"><meta property="og:url" content="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/날마다하나님께로더가까이_존비비어/"><meta property="og:description" content="출애굽의 목적지는 젖과 꿀이 흐르는 땅이 아니라 「광야에서 나를 섬김」이었다. 하나님은 우리와 가까워지기를 갈망하시지만 결코 강요하지 않으신다 — 친밀함은 우리의 반응만큼 깊어진다. 에녹에서 다윗까지 동행한 사람들의 계보를 따라가며, 한 독자가 여백에 남긴 한 줄로 책 전체를 요약한다: 들음 → 믿음 → 확신 → 순종 → 친밀."><meta property="og:site_name" content="영닥터 아카이브"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="날마다 하나님께로 더 가까이 — 하나님은 왜 친밀함을 강요하지 않으시는가"><meta name="twitter:description" content="출애굽의 목적지는 젖과 꿀이 흐르는 땅이 아니라 「광야에서 나를 섬김」이었다. 하나님은 우리와 가까워지기를 갈망하시지만 결코 강요하지 않으신다 — 친밀함은 우리의 반응만큼 깊어진다. 에녹에서 다윗까지 동행한 사람들의 계보를 따라가며, 한 독자가 여백에 남긴 한 줄로 책 전체를 요약한다: 들음 → 믿음 → 확신 → 순종 → 친밀."><meta http-equiv="refresh" content="0;url=https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/날마다하나님께로더가까이_존비비어/"><link rel="canonical" href="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/날마다하나님께로더가까이_존비비어/"></head><body><a href="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/날마다하나님께로더가까이_존비비어/">Redirecting…</a></body></html>
