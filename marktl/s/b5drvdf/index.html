<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>관계가 주는 기쁨 — 관계는 행복의 기계가 아니라 구원의 도구다</title><meta name="description" content="의사소통 기법과 갈등 해결 전략을 다 익혀도 관계가 여전히 아픈 이유는, 우리가 수평에서 답을 찾기 때문이다. 두 성경적 상담학자는 관계의 문제를 「상대가 누구인가」가 아니라 「이 관계를 통해 하나님이 내게 무엇을 드러내시는가」로 바꿔 묻는다. 갈등은 피할 사고가 아니라 하나님이 계신 자리이고, 용서는 수직으로는 무조건이며 수평으로는 회개를 따른다 — 관계를 성화의 현장으로 읽는 책."><meta property="og:title" content="관계가 주는 기쁨 — 관계는 행복의 기계가 아니라 구원의 도구다"><meta property="og:type" content="article"><meta property="og:url" content="https://wiki.youngdoctor.kr/marktl/관계가주는기쁨_트립레인/"><meta property="og:description" content="의사소통 기법과 갈등 해결 전략을 다 익혀도 관계가 여전히 아픈 이유는, 우리가 수평에서 답을 찾기 때문이다. 두 성경적 상담학자는 관계의 문제를 「상대가 누구인가」가 아니라 「이 관계를 통해 하나님이 내게 무엇을 드러내시는가」로 바꿔 묻는다. 갈등은 피할 사고가 아니라 하나님이 계신 자리이고, 용서는 수직으로는 무조건이며 수평으로는 회개를 따른다 — 관계를 성화의 현장으로 읽는 책."><meta property="og:site_name" content="영닥터 아카이브"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="관계가 주는 기쁨 — 관계는 행복의 기계가 아니라 구원의 도구다"><meta name="twitter:description" content="의사소통 기법과 갈등 해결 전략을 다 익혀도 관계가 여전히 아픈 이유는, 우리가 수평에서 답을 찾기 때문이다. 두 성경적 상담학자는 관계의 문제를 「상대가 누구인가」가 아니라 「이 관계를 통해 하나님이 내게 무엇을 드러내시는가」로 바꿔 묻는다. 갈등은 피할 사고가 아니라 하나님이 계신 자리이고, 용서는 수직으로는 무조건이며 수평으로는 회개를 따른다 — 관계를 성화의 현장으로 읽는 책."><meta http-equiv="refresh" content="0;url=https://wiki.youngdoctor.kr/marktl/관계가주는기쁨_트립레인/"><link rel="canonical" href="https://wiki.youngdoctor.kr/marktl/관계가주는기쁨_트립레인/"></head><body><a href="https://wiki.youngdoctor.kr/marktl/관계가주는기쁨_트립레인/">Redirecting…</a></body></html>
