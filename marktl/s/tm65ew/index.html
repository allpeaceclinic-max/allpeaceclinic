<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>문화와 선교 — 복음은 문화의 옷을 벗고 전해질 수 없다</title><meta name="description" content="선교는 비행기를 타는 일이 아니라 낯선 게임의 룰 안으로 들어가는 일이다. 잼 한 병을 두고 세 나라 청년이 모두 상처받는 식탁에서 출발해, 사마리아에선 「그리스도」를 안디옥에선 「주 예수」를 전한 초대교회의 상황화, 그리고 건물이 서면 치워야 할 비계목으로서의 선교사까지 — 인도네시아에서 회계학을 가르친 선교사가 13주 강의로 엮은 타문화 선교의 문법이다."><meta property="og:title" content="문화와 선교 — 복음은 문화의 옷을 벗고 전해질 수 없다"><meta property="og:type" content="article"><meta property="og:url" content="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/문화와선교_손창남/"><meta property="og:description" content="선교는 비행기를 타는 일이 아니라 낯선 게임의 룰 안으로 들어가는 일이다. 잼 한 병을 두고 세 나라 청년이 모두 상처받는 식탁에서 출발해, 사마리아에선 「그리스도」를 안디옥에선 「주 예수」를 전한 초대교회의 상황화, 그리고 건물이 서면 치워야 할 비계목으로서의 선교사까지 — 인도네시아에서 회계학을 가르친 선교사가 13주 강의로 엮은 타문화 선교의 문법이다."><meta property="og:site_name" content="영닥터 아카이브"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="문화와 선교 — 복음은 문화의 옷을 벗고 전해질 수 없다"><meta name="twitter:description" content="선교는 비행기를 타는 일이 아니라 낯선 게임의 룰 안으로 들어가는 일이다. 잼 한 병을 두고 세 나라 청년이 모두 상처받는 식탁에서 출발해, 사마리아에선 「그리스도」를 안디옥에선 「주 예수」를 전한 초대교회의 상황화, 그리고 건물이 서면 치워야 할 비계목으로서의 선교사까지 — 인도네시아에서 회계학을 가르친 선교사가 13주 강의로 엮은 타문화 선교의 문법이다."><meta http-equiv="refresh" content="0;url=https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/문화와선교_손창남/"><link rel="canonical" href="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/문화와선교_손창남/"></head><body><a href="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/문화와선교_손창남/">Redirecting…</a></body></html>
