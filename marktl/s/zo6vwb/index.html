<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>고난과 하나님의 선교 — 왜 고난은 선교의 부작용이 아닌가</title><meta name="description" content="암으로 죽어 가는 성도, 치매를 앓는 그리스도인, 사고로 자녀를 잃은 신자. '타락-구속'의 틀에서 이들의 고통은 순교자의 고난과 달리 '그냥 견뎌야 할 무의미한 것'으로 밀려난다. 이 책은 그 틀을 해체하고 하나님의 선교를 사랑 공동체의 무한한 확장으로 다시 정의한 뒤, 고난을 사랑이 처음부터 감수한 위험으로 되돌려 놓는다. 총론에 이어 요한복음 고별설교·고린도후서·요한계시록 세 편의 본문 연구가 같은 물음을 각기 다른 각도에서 다시 묻는다."><meta property="og:title" content="고난과 하나님의 선교 — 왜 고난은 선교의 부작용이 아닌가"><meta property="og:type" content="article"><meta property="og:url" content="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/고난과하나님의선교_스티븐테일러외/"><meta property="og:description" content="암으로 죽어 가는 성도, 치매를 앓는 그리스도인, 사고로 자녀를 잃은 신자. '타락-구속'의 틀에서 이들의 고통은 순교자의 고난과 달리 '그냥 견뎌야 할 무의미한 것'으로 밀려난다. 이 책은 그 틀을 해체하고 하나님의 선교를 사랑 공동체의 무한한 확장으로 다시 정의한 뒤, 고난을 사랑이 처음부터 감수한 위험으로 되돌려 놓는다. 총론에 이어 요한복음 고별설교·고린도후서·요한계시록 세 편의 본문 연구가 같은 물음을 각기 다른 각도에서 다시 묻는다."><meta property="og:site_name" content="영닥터 아카이브"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="고난과 하나님의 선교 — 왜 고난은 선교의 부작용이 아닌가"><meta name="twitter:description" content="암으로 죽어 가는 성도, 치매를 앓는 그리스도인, 사고로 자녀를 잃은 신자. '타락-구속'의 틀에서 이들의 고통은 순교자의 고난과 달리 '그냥 견뎌야 할 무의미한 것'으로 밀려난다. 이 책은 그 틀을 해체하고 하나님의 선교를 사랑 공동체의 무한한 확장으로 다시 정의한 뒤, 고난을 사랑이 처음부터 감수한 위험으로 되돌려 놓는다. 총론에 이어 요한복음 고별설교·고린도후서·요한계시록 세 편의 본문 연구가 같은 물음을 각기 다른 각도에서 다시 묻는다."><meta http-equiv="refresh" content="0;url=https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/고난과하나님의선교_스티븐테일러외/"><link rel="canonical" href="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/고난과하나님의선교_스티븐테일러외/"></head><body><a href="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/고난과하나님의선교_스티븐테일러외/">Redirecting…</a></body></html>
