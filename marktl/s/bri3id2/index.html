<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>전도학 개론 — 동참과 선포, 순서의 문제</title><meta name="description" content="전도를 둘러싼 오래된 다툼이 있다. 삶으로 곁에 있어 주는 것이 전도인가, 입을 열어 선포하는 것이 전도인가. 홍성철은 양자택일로 답하지 않는다. 그는 1974년 로잔 정의에서 세 단어를 뽑아내고 하나를 더해 전도를 네 국면으로 분해한 뒤, 동참을 「전도 이전의 전도」로, 선포를 「전도의 심장」으로 각각 제자리에 앉힌다. 매슬로우의 필요 위계를 교회의 세 사역과 맞세우고 창세기 3장 15절에서 십자가까지 점진적 계시의 사슬을 꿰는 이 교과서는, 결국 「전도는 언제나 필요라는 상황에서 일어난다」는 한 문장으로 현장을 겨눈다."><meta property="og:title" content="전도학 개론 — 동참과 선포, 순서의 문제"><meta property="og:type" content="article"><meta property="og:url" content="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/전도학개론_홍성철/"><meta property="og:description" content="전도를 둘러싼 오래된 다툼이 있다. 삶으로 곁에 있어 주는 것이 전도인가, 입을 열어 선포하는 것이 전도인가. 홍성철은 양자택일로 답하지 않는다. 그는 1974년 로잔 정의에서 세 단어를 뽑아내고 하나를 더해 전도를 네 국면으로 분해한 뒤, 동참을 「전도 이전의 전도」로, 선포를 「전도의 심장」으로 각각 제자리에 앉힌다. 매슬로우의 필요 위계를 교회의 세 사역과 맞세우고 창세기 3장 15절에서 십자가까지 점진적 계시의 사슬을 꿰는 이 교과서는, 결국 「전도는 언제나 필요라는 상황에서 일어난다」는 한 문장으로 현장을 겨눈다."><meta property="og:site_name" content="영닥터 아카이브"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="전도학 개론 — 동참과 선포, 순서의 문제"><meta name="twitter:description" content="전도를 둘러싼 오래된 다툼이 있다. 삶으로 곁에 있어 주는 것이 전도인가, 입을 열어 선포하는 것이 전도인가. 홍성철은 양자택일로 답하지 않는다. 그는 1974년 로잔 정의에서 세 단어를 뽑아내고 하나를 더해 전도를 네 국면으로 분해한 뒤, 동참을 「전도 이전의 전도」로, 선포를 「전도의 심장」으로 각각 제자리에 앉힌다. 매슬로우의 필요 위계를 교회의 세 사역과 맞세우고 창세기 3장 15절에서 십자가까지 점진적 계시의 사슬을 꿰는 이 교과서는, 결국 「전도는 언제나 필요라는 상황에서 일어난다」는 한 문장으로 현장을 겨눈다."><meta http-equiv="refresh" content="0;url=https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/전도학개론_홍성철/"><link rel="canonical" href="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/전도학개론_홍성철/"></head><body><a href="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/전도학개론_홍성철/">Redirecting…</a></body></html>
