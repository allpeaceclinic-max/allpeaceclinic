<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>일의 신학 — 성경의 일꾼들에게서 시작하다</title><meta name="description" content="일의 신학을 쓰는 흔한 방법은 창조론이나 소명론이라는 교리 항목에서 출발하는 것이다. 이 책은 그 길을 택하지 않는다. 대신 성경이 하나님을 묘사할 때 이미 정원사·목자·옹기장이·의사·교사·대장장이라는 직업의 언어를 쓴다는 관찰에서 시작해, 오경에서 신약까지 일하는 사람들을 하나씩 따라간다. 그 끝에서 저자가 박는 못은 하나다 — 일의 성속을 가르는 것은 직종도 결과도 아니고, 그 일이 무엇으로 행해졌는가다."><meta property="og:title" content="일의 신학 — 성경의 일꾼들에게서 시작하다"><meta property="og:type" content="article"><meta property="og:url" content="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/일의신학_폴스티븐스/"><meta property="og:description" content="일의 신학을 쓰는 흔한 방법은 창조론이나 소명론이라는 교리 항목에서 출발하는 것이다. 이 책은 그 길을 택하지 않는다. 대신 성경이 하나님을 묘사할 때 이미 정원사·목자·옹기장이·의사·교사·대장장이라는 직업의 언어를 쓴다는 관찰에서 시작해, 오경에서 신약까지 일하는 사람들을 하나씩 따라간다. 그 끝에서 저자가 박는 못은 하나다 — 일의 성속을 가르는 것은 직종도 결과도 아니고, 그 일이 무엇으로 행해졌는가다."><meta property="og:site_name" content="영닥터 아카이브"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="일의 신학 — 성경의 일꾼들에게서 시작하다"><meta name="twitter:description" content="일의 신학을 쓰는 흔한 방법은 창조론이나 소명론이라는 교리 항목에서 출발하는 것이다. 이 책은 그 길을 택하지 않는다. 대신 성경이 하나님을 묘사할 때 이미 정원사·목자·옹기장이·의사·교사·대장장이라는 직업의 언어를 쓴다는 관찰에서 시작해, 오경에서 신약까지 일하는 사람들을 하나씩 따라간다. 그 끝에서 저자가 박는 못은 하나다 — 일의 성속을 가르는 것은 직종도 결과도 아니고, 그 일이 무엇으로 행해졌는가다."><meta http-equiv="refresh" content="0;url=https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/일의신학_폴스티븐스/"><link rel="canonical" href="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/일의신학_폴스티븐스/"></head><body><a href="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/일의신학_폴스티븐스/">Redirecting…</a></body></html>
