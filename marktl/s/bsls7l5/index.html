<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>거버넌스 — 청지기의 프로세스, 공의회의 분별</title><meta name="description" content="거버넌스가 무너지면 으레 사람을 탓한다. 그러나 사람이 바뀌어도 같은 문제가 반복되는 이유는 방식(System)에 있다. 예루살렘 공의회에서 변화한 것은 이방인이 아니라 예루살렘 자신이었다. 이사회도 총회도 주인이 아니라 청지기일 뿐이라는 고백에서 출발하여, 듣기·분별·평가의 거룩한 순환이 어떻게 선교단체·교회·비영리 기관에서 작동하고 자라나는지를 10개의 축으로 추적한다."><meta property="og:title" content="거버넌스 — 청지기의 프로세스, 공의회의 분별"><meta property="og:type" content="article"><meta property="og:url" content="https://wiki.youngdoctor.kr/marktl/거버넌스/"><meta property="og:description" content="거버넌스가 무너지면 으레 사람을 탓한다. 그러나 사람이 바뀌어도 같은 문제가 반복되는 이유는 방식(System)에 있다. 예루살렘 공의회에서 변화한 것은 이방인이 아니라 예루살렘 자신이었다. 이사회도 총회도 주인이 아니라 청지기일 뿐이라는 고백에서 출발하여, 듣기·분별·평가의 거룩한 순환이 어떻게 선교단체·교회·비영리 기관에서 작동하고 자라나는지를 10개의 축으로 추적한다."><meta property="og:site_name" content="영닥터 아카이브"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="거버넌스 — 청지기의 프로세스, 공의회의 분별"><meta name="twitter:description" content="거버넌스가 무너지면 으레 사람을 탓한다. 그러나 사람이 바뀌어도 같은 문제가 반복되는 이유는 방식(System)에 있다. 예루살렘 공의회에서 변화한 것은 이방인이 아니라 예루살렘 자신이었다. 이사회도 총회도 주인이 아니라 청지기일 뿐이라는 고백에서 출발하여, 듣기·분별·평가의 거룩한 순환이 어떻게 선교단체·교회·비영리 기관에서 작동하고 자라나는지를 10개의 축으로 추적한다."><meta http-equiv="refresh" content="0;url=https://wiki.youngdoctor.kr/marktl/거버넌스/"><link rel="canonical" href="https://wiki.youngdoctor.kr/marktl/거버넌스/"></head><body><a href="https://wiki.youngdoctor.kr/marktl/거버넌스/">Redirecting…</a></body></html>
