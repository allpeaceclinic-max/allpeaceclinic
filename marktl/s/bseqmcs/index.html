<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>영성 — 하나님과의 살아 있는 관계를 삶에서 살아내다</title><meta name="description" content="영성은 기도 시간의 길이나 체험의 강도가 아니라, 하나님의 눈으로 일상을 해석하는 능력이다. 열두 정탐꾼이 같은 땅을 보고 다른 결론에 도달한 것처럼, 영성은 주어진 현실을 하나님의 관점에서 다시 읽는 눈에 달려 있다. 이 에세이는 해석의 능력에서 출발하여 뿌리와 정체성, 생활영성과 공동체, 빼앗으심을 통한 성숙, 직장과 관계의 현장을 관통하며, 영성이 기도원 안의 사건에 머물지 않고 삶 전체에 착지하는 과정을 추적한다."><meta property="og:title" content="영성 — 하나님과의 살아 있는 관계를 삶에서 살아내다"><meta property="og:type" content="article"><meta property="og:url" content="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/영성/"><meta property="og:description" content="영성은 기도 시간의 길이나 체험의 강도가 아니라, 하나님의 눈으로 일상을 해석하는 능력이다. 열두 정탐꾼이 같은 땅을 보고 다른 결론에 도달한 것처럼, 영성은 주어진 현실을 하나님의 관점에서 다시 읽는 눈에 달려 있다. 이 에세이는 해석의 능력에서 출발하여 뿌리와 정체성, 생활영성과 공동체, 빼앗으심을 통한 성숙, 직장과 관계의 현장을 관통하며, 영성이 기도원 안의 사건에 머물지 않고 삶 전체에 착지하는 과정을 추적한다."><meta property="og:site_name" content="영닥터 아카이브"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="영성 — 하나님과의 살아 있는 관계를 삶에서 살아내다"><meta name="twitter:description" content="영성은 기도 시간의 길이나 체험의 강도가 아니라, 하나님의 눈으로 일상을 해석하는 능력이다. 열두 정탐꾼이 같은 땅을 보고 다른 결론에 도달한 것처럼, 영성은 주어진 현실을 하나님의 관점에서 다시 읽는 눈에 달려 있다. 이 에세이는 해석의 능력에서 출발하여 뿌리와 정체성, 생활영성과 공동체, 빼앗으심을 통한 성숙, 직장과 관계의 현장을 관통하며, 영성이 기도원 안의 사건에 머물지 않고 삶 전체에 착지하는 과정을 추적한다."><meta http-equiv="refresh" content="0;url=https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/영성/"><link rel="canonical" href="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/영성/"></head><body><a href="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/영성/">Redirecting…</a></body></html>
