<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>사도행전을 선교적으로 읽으면 두 모델이 보인다 — 선교사보다 흩어진 사람들이 더 멀리 갔다</title><meta name="description" content="바울이 로마에 닿았을 때, 그를 맞으러 나온 형제들이 이미 거기 있었다. 사도행전에는 파송된 선교팀의 이야기만이 아니라, 핍박에 떠밀려 직업을 들고 제국을 떠돈 이름 없는 사람들의 이야기가 함께 흐른다. 서구 선교 400년이 앞의 모델이었다면, 비자가 닫히고 1억 명이 일자리를 따라 움직이는 지금은 뒤의 모델이 다시 적절해진 시대다."><meta property="og:title" content="사도행전을 선교적으로 읽으면 두 모델이 보인다 — 선교사보다 흩어진 사람들이 더 멀리 갔다"><meta property="og:type" content="article"><meta property="og:url" content="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/사도행전을선교적으로읽으면_손창남/"><meta property="og:description" content="바울이 로마에 닿았을 때, 그를 맞으러 나온 형제들이 이미 거기 있었다. 사도행전에는 파송된 선교팀의 이야기만이 아니라, 핍박에 떠밀려 직업을 들고 제국을 떠돈 이름 없는 사람들의 이야기가 함께 흐른다. 서구 선교 400년이 앞의 모델이었다면, 비자가 닫히고 1억 명이 일자리를 따라 움직이는 지금은 뒤의 모델이 다시 적절해진 시대다."><meta property="og:site_name" content="영닥터 아카이브"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="사도행전을 선교적으로 읽으면 두 모델이 보인다 — 선교사보다 흩어진 사람들이 더 멀리 갔다"><meta name="twitter:description" content="바울이 로마에 닿았을 때, 그를 맞으러 나온 형제들이 이미 거기 있었다. 사도행전에는 파송된 선교팀의 이야기만이 아니라, 핍박에 떠밀려 직업을 들고 제국을 떠돈 이름 없는 사람들의 이야기가 함께 흐른다. 서구 선교 400년이 앞의 모델이었다면, 비자가 닫히고 1억 명이 일자리를 따라 움직이는 지금은 뒤의 모델이 다시 적절해진 시대다."><meta http-equiv="refresh" content="0;url=https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/사도행전을선교적으로읽으면_손창남/"><link rel="canonical" href="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/사도행전을선교적으로읽으면_손창남/"></head><body><a href="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/사도행전을선교적으로읽으면_손창남/">Redirecting…</a></body></html>
