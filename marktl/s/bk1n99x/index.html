<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>일터 신학 — 의미와 동기로 읽는 사업</title><meta name="description" content="『일의 신학』의 자매편이다. 앞의 책이 일 일반을 성경 인물의 이력으로 따라갔다면, 이 책은 사업이라는 한 영역을 의미(신학)와 동기(영성) 두 축으로 파고든다. 시작은 익숙한 증상이다 — 일요일에는 열렬한 유신론자였다가 월요일에는 실질적인 무신론자로 사는 분열. 저자는 그 원인을 신앙인의 의식 속에 박힌 영적 위계에서 찾고, 그 사다리가 어떻게 만들어졌는지를 그리스에서 후기 개신교까지 되짚는다. 결론은 한 문장이다 — 소명이 세상에서는 세속화되었고 교회에서는 성직화되었다."><meta property="og:title" content="일터 신학 — 의미와 동기로 읽는 사업"><meta property="og:type" content="article"><meta property="og:url" content="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/일터신학_폴스티븐스/"><meta property="og:description" content="『일의 신학』의 자매편이다. 앞의 책이 일 일반을 성경 인물의 이력으로 따라갔다면, 이 책은 사업이라는 한 영역을 의미(신학)와 동기(영성) 두 축으로 파고든다. 시작은 익숙한 증상이다 — 일요일에는 열렬한 유신론자였다가 월요일에는 실질적인 무신론자로 사는 분열. 저자는 그 원인을 신앙인의 의식 속에 박힌 영적 위계에서 찾고, 그 사다리가 어떻게 만들어졌는지를 그리스에서 후기 개신교까지 되짚는다. 결론은 한 문장이다 — 소명이 세상에서는 세속화되었고 교회에서는 성직화되었다."><meta property="og:site_name" content="영닥터 아카이브"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="일터 신학 — 의미와 동기로 읽는 사업"><meta name="twitter:description" content="『일의 신학』의 자매편이다. 앞의 책이 일 일반을 성경 인물의 이력으로 따라갔다면, 이 책은 사업이라는 한 영역을 의미(신학)와 동기(영성) 두 축으로 파고든다. 시작은 익숙한 증상이다 — 일요일에는 열렬한 유신론자였다가 월요일에는 실질적인 무신론자로 사는 분열. 저자는 그 원인을 신앙인의 의식 속에 박힌 영적 위계에서 찾고, 그 사다리가 어떻게 만들어졌는지를 그리스에서 후기 개신교까지 되짚는다. 결론은 한 문장이다 — 소명이 세상에서는 세속화되었고 교회에서는 성직화되었다."><meta http-equiv="refresh" content="0;url=https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/일터신학_폴스티븐스/"><link rel="canonical" href="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/일터신학_폴스티븐스/"></head><body><a href="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/일터신학_폴스티븐스/">Redirecting…</a></body></html>
