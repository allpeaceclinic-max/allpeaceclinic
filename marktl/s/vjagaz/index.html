<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>행복한 결혼생활의 비결 — 기대의 거래에서 언약의 설계로</title><meta name="description" content="첫 남편의 자살로 끝난 결혼을 겪은 저자는, 그 결혼이 무너진 이유를 성격이 아니라 「서로의 기대를 채워 주면 사랑하겠다」는 너무나 합리적으로 보였던 거래에서 찾는다. 그리고 다바크·에제르·테슈카·휘포타소 같은 원어 낱말을 하나씩 짚으며 결혼·성·자녀·돈·이혼을 하나님의 설계서로 다시 읽는다. 결혼을 붙이는 「초강력 접착제」가 무엇인지 묻는 책이다."><meta property="og:title" content="행복한 결혼생활의 비결 — 기대의 거래에서 언약의 설계로"><meta property="og:type" content="article"><meta property="og:url" content="https://wiki.youngdoctor.kr/marktl/행복한결혼생활의비결_케이아더/"><meta property="og:description" content="첫 남편의 자살로 끝난 결혼을 겪은 저자는, 그 결혼이 무너진 이유를 성격이 아니라 「서로의 기대를 채워 주면 사랑하겠다」는 너무나 합리적으로 보였던 거래에서 찾는다. 그리고 다바크·에제르·테슈카·휘포타소 같은 원어 낱말을 하나씩 짚으며 결혼·성·자녀·돈·이혼을 하나님의 설계서로 다시 읽는다. 결혼을 붙이는 「초강력 접착제」가 무엇인지 묻는 책이다."><meta property="og:site_name" content="영닥터 아카이브"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="행복한 결혼생활의 비결 — 기대의 거래에서 언약의 설계로"><meta name="twitter:description" content="첫 남편의 자살로 끝난 결혼을 겪은 저자는, 그 결혼이 무너진 이유를 성격이 아니라 「서로의 기대를 채워 주면 사랑하겠다」는 너무나 합리적으로 보였던 거래에서 찾는다. 그리고 다바크·에제르·테슈카·휘포타소 같은 원어 낱말을 하나씩 짚으며 결혼·성·자녀·돈·이혼을 하나님의 설계서로 다시 읽는다. 결혼을 붙이는 「초강력 접착제」가 무엇인지 묻는 책이다."><meta http-equiv="refresh" content="0;url=https://wiki.youngdoctor.kr/marktl/행복한결혼생활의비결_케이아더/"><link rel="canonical" href="https://wiki.youngdoctor.kr/marktl/행복한결혼생활의비결_케이아더/"></head><body><a href="https://wiki.youngdoctor.kr/marktl/행복한결혼생활의비결_케이아더/">Redirecting…</a></body></html>
