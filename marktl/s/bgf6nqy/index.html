<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>인비저블 처치 — 김성규</title><meta name="description" content="서울 도심 직장인 곁에서 시작된 개척 일지다. 교회를 홍보하는 일과 복음을 전하는 일을 분리하고, 모으는 대신 흩어 보내며, 규모를 키우는 대신 같은 모양을 하나 더 만든다. 목사이자 철강회사 김과장으로 살아 본 사람만 쓸 수 있는 문장들 — 종교인이라는 선, 술을 마시지 않는 결단의 무게, 그리고 큰 교회를 지향하지 않겠다는 선택. 밑줄과 여백 손글씨 98장의 전사에서 길어 올린 독서 노트."><meta property="og:title" content="인비저블 처치 — 김성규"><meta property="og:type" content="article"><meta property="og:url" content="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/인비저블처치_김성규/"><meta property="og:description" content="서울 도심 직장인 곁에서 시작된 개척 일지다. 교회를 홍보하는 일과 복음을 전하는 일을 분리하고, 모으는 대신 흩어 보내며, 규모를 키우는 대신 같은 모양을 하나 더 만든다. 목사이자 철강회사 김과장으로 살아 본 사람만 쓸 수 있는 문장들 — 종교인이라는 선, 술을 마시지 않는 결단의 무게, 그리고 큰 교회를 지향하지 않겠다는 선택. 밑줄과 여백 손글씨 98장의 전사에서 길어 올린 독서 노트."><meta property="og:site_name" content="영닥터 아카이브"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="인비저블 처치 — 김성규"><meta name="twitter:description" content="서울 도심 직장인 곁에서 시작된 개척 일지다. 교회를 홍보하는 일과 복음을 전하는 일을 분리하고, 모으는 대신 흩어 보내며, 규모를 키우는 대신 같은 모양을 하나 더 만든다. 목사이자 철강회사 김과장으로 살아 본 사람만 쓸 수 있는 문장들 — 종교인이라는 선, 술을 마시지 않는 결단의 무게, 그리고 큰 교회를 지향하지 않겠다는 선택. 밑줄과 여백 손글씨 98장의 전사에서 길어 올린 독서 노트."><meta http-equiv="refresh" content="0;url=https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/인비저블처치_김성규/"><link rel="canonical" href="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/인비저블처치_김성규/"></head><body><a href="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/인비저블처치_김성규/">Redirecting…</a></body></html>
