<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>오만과 환대 — 사흘 동안 묻지 않는다</title><meta name="description" content="먼저 밝혀 둘 것이 있다. 제목의 '오만'은 교만이 아니라 아라비아 반도 동남단의 나라 이름이다. 그 나라에는 규칙이 하나 있다 — 손님이 오면 최소한 사흘 동안은 왜, 어디서 왔는지 묻지 않는다. 국경 마을 부래미에서 10년 반을 산 기록은 그 규칙 안으로 걸어 들어간 이야기이고, 마지막 페이지에서 뜻밖의 자리에 도착한다. 아브라함처럼 장막 문에서 달려 나와 맞아들인 쪽은 우리가 아니었다는 것."><meta property="og:title" content="오만과 환대 — 사흘 동안 묻지 않는다"><meta property="og:type" content="article"><meta property="og:url" content="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/오만과환대_이선용/"><meta property="og:description" content="먼저 밝혀 둘 것이 있다. 제목의 '오만'은 교만이 아니라 아라비아 반도 동남단의 나라 이름이다. 그 나라에는 규칙이 하나 있다 — 손님이 오면 최소한 사흘 동안은 왜, 어디서 왔는지 묻지 않는다. 국경 마을 부래미에서 10년 반을 산 기록은 그 규칙 안으로 걸어 들어간 이야기이고, 마지막 페이지에서 뜻밖의 자리에 도착한다. 아브라함처럼 장막 문에서 달려 나와 맞아들인 쪽은 우리가 아니었다는 것."><meta property="og:site_name" content="영닥터 아카이브"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="오만과 환대 — 사흘 동안 묻지 않는다"><meta name="twitter:description" content="먼저 밝혀 둘 것이 있다. 제목의 '오만'은 교만이 아니라 아라비아 반도 동남단의 나라 이름이다. 그 나라에는 규칙이 하나 있다 — 손님이 오면 최소한 사흘 동안은 왜, 어디서 왔는지 묻지 않는다. 국경 마을 부래미에서 10년 반을 산 기록은 그 규칙 안으로 걸어 들어간 이야기이고, 마지막 페이지에서 뜻밖의 자리에 도착한다. 아브라함처럼 장막 문에서 달려 나와 맞아들인 쪽은 우리가 아니었다는 것."><meta http-equiv="refresh" content="0;url=https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/오만과환대_이선용/"><link rel="canonical" href="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/오만과환대_이선용/"></head><body><a href="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/오만과환대_이선용/">Redirecting…</a></body></html>
