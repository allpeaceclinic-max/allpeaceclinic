<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>라이프워크 — 일이 저주가 아니라면</title><meta name="description" content="크리스천은 이렇게 많은데 왜 사회는 깨져 있는가. 대로우 밀러는 그 답을 신앙의 열심이 아니라 삶을 둘로 쪼갠 세계관에서 찾는다. 플라톤에서 영지주의, 경건주의를 거쳐 오늘의 '복음주의적 영지주의'에 이르는 성속 이분법의 계보를 추적한 뒤, 저주받은 것은 일이 아니라 땅이었다는 한 문장으로 판을 뒤집는다. 진료실과 법정과 교실이 곧 성문(城門)이라면, 우리는 지금 어느 문을 지키고 있는가."><meta property="og:title" content="라이프워크 — 일이 저주가 아니라면"><meta property="og:type" content="article"><meta property="og:url" content="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/라이프워크_대로우밀러/"><meta property="og:description" content="크리스천은 이렇게 많은데 왜 사회는 깨져 있는가. 대로우 밀러는 그 답을 신앙의 열심이 아니라 삶을 둘로 쪼갠 세계관에서 찾는다. 플라톤에서 영지주의, 경건주의를 거쳐 오늘의 '복음주의적 영지주의'에 이르는 성속 이분법의 계보를 추적한 뒤, 저주받은 것은 일이 아니라 땅이었다는 한 문장으로 판을 뒤집는다. 진료실과 법정과 교실이 곧 성문(城門)이라면, 우리는 지금 어느 문을 지키고 있는가."><meta property="og:site_name" content="영닥터 아카이브"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="라이프워크 — 일이 저주가 아니라면"><meta name="twitter:description" content="크리스천은 이렇게 많은데 왜 사회는 깨져 있는가. 대로우 밀러는 그 답을 신앙의 열심이 아니라 삶을 둘로 쪼갠 세계관에서 찾는다. 플라톤에서 영지주의, 경건주의를 거쳐 오늘의 '복음주의적 영지주의'에 이르는 성속 이분법의 계보를 추적한 뒤, 저주받은 것은 일이 아니라 땅이었다는 한 문장으로 판을 뒤집는다. 진료실과 법정과 교실이 곧 성문(城門)이라면, 우리는 지금 어느 문을 지키고 있는가."><meta http-equiv="refresh" content="0;url=https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/라이프워크_대로우밀러/"><link rel="canonical" href="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/라이프워크_대로우밀러/"></head><body><a href="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/라이프워크_대로우밀러/">Redirecting…</a></body></html>
