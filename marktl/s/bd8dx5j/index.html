<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>상처 입은 치유자 — 물러섬이 곧 집중이다</title><meta name="description" content="제목만 널리 알려진 탓에 이 책은 자주 오해된다. 상처를 보여주라는 말로 읽히는 것이다. 그러나 저자는 같은 장에서 정반대의 안전장치를 건다 — 노출된 상처는 악취를 풍길 뿐 치유의 능력이 없다. 상처가 치유의 원천이 되려면 형식이 필요하고, 그 형식이 환대다. 그리고 환대의 첫 조건은 채우는 것이 아니라 물러서는 것이다. 창조를 위해 하나님이 물러나셨듯이."><meta property="og:title" content="상처 입은 치유자 — 물러섬이 곧 집중이다"><meta property="og:type" content="article"><meta property="og:url" content="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/상처입은치유자_헨리나우웬/"><meta property="og:description" content="제목만 널리 알려진 탓에 이 책은 자주 오해된다. 상처를 보여주라는 말로 읽히는 것이다. 그러나 저자는 같은 장에서 정반대의 안전장치를 건다 — 노출된 상처는 악취를 풍길 뿐 치유의 능력이 없다. 상처가 치유의 원천이 되려면 형식이 필요하고, 그 형식이 환대다. 그리고 환대의 첫 조건은 채우는 것이 아니라 물러서는 것이다. 창조를 위해 하나님이 물러나셨듯이."><meta property="og:site_name" content="영닥터 아카이브"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="상처 입은 치유자 — 물러섬이 곧 집중이다"><meta name="twitter:description" content="제목만 널리 알려진 탓에 이 책은 자주 오해된다. 상처를 보여주라는 말로 읽히는 것이다. 그러나 저자는 같은 장에서 정반대의 안전장치를 건다 — 노출된 상처는 악취를 풍길 뿐 치유의 능력이 없다. 상처가 치유의 원천이 되려면 형식이 필요하고, 그 형식이 환대다. 그리고 환대의 첫 조건은 채우는 것이 아니라 물러서는 것이다. 창조를 위해 하나님이 물러나셨듯이."><meta http-equiv="refresh" content="0;url=https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/상처입은치유자_헨리나우웬/"><link rel="canonical" href="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/상처입은치유자_헨리나우웬/"></head><body><a href="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/상처입은치유자_헨리나우웬/">Redirecting…</a></body></html>
