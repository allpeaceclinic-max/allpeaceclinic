<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>글로벌 미션 핸드북 — 스티브 호크 · 빌 테일러 · 한철호</title><meta name="description" content="선교 헌신자를 위한 3단계 10장 워크북을 사진 275장의 밑줄로 다시 읽었다. 이 허브는 장별 노트를 한 줄로 꿰고, 책 전체를 관통하는 다섯 축 — 존재에서 사역으로, 부르심은 검증된다, 파송은 교회의 일, 단기는 장기를 위한 과정, 잘 마치는 것이 잘 시작하는 것보다 중요하다 — 을 세운다. 이 책을 교재로 삼았던 동신 미션앤톡 12주와 멘토링 시리즈 강의가 어느 장에 닿는지도 함께 적었다."><meta property="og:title" content="글로벌 미션 핸드북 — 스티브 호크 · 빌 테일러 · 한철호"><meta property="og:type" content="article"><meta property="og:url" content="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/글로벌미션핸드북/"><meta property="og:description" content="선교 헌신자를 위한 3단계 10장 워크북을 사진 275장의 밑줄로 다시 읽었다. 이 허브는 장별 노트를 한 줄로 꿰고, 책 전체를 관통하는 다섯 축 — 존재에서 사역으로, 부르심은 검증된다, 파송은 교회의 일, 단기는 장기를 위한 과정, 잘 마치는 것이 잘 시작하는 것보다 중요하다 — 을 세운다. 이 책을 교재로 삼았던 동신 미션앤톡 12주와 멘토링 시리즈 강의가 어느 장에 닿는지도 함께 적었다."><meta property="og:site_name" content="영닥터 아카이브"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="글로벌 미션 핸드북 — 스티브 호크 · 빌 테일러 · 한철호"><meta name="twitter:description" content="선교 헌신자를 위한 3단계 10장 워크북을 사진 275장의 밑줄로 다시 읽었다. 이 허브는 장별 노트를 한 줄로 꿰고, 책 전체를 관통하는 다섯 축 — 존재에서 사역으로, 부르심은 검증된다, 파송은 교회의 일, 단기는 장기를 위한 과정, 잘 마치는 것이 잘 시작하는 것보다 중요하다 — 을 세운다. 이 책을 교재로 삼았던 동신 미션앤톡 12주와 멘토링 시리즈 강의가 어느 장에 닿는지도 함께 적었다."><meta http-equiv="refresh" content="0;url=https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/글로벌미션핸드북/"><link rel="canonical" href="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/글로벌미션핸드북/"></head><body><a href="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/글로벌미션핸드북/">Redirecting…</a></body></html>
