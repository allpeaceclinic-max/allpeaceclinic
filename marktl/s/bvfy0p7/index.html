<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>초기 교회와 인내의 발효 — 앨런 크라이더</title><meta name="description" content="처음 3세기 교회는 선교 전략도, 전도 논문 한 편도, 이름이 알려진 선교사도 거의 없이 10년마다 40퍼센트씩 자랐다. 크라이더는 그 비밀을 '인내'라는 덕과 몸에 밴 습관(아비투스), 그것을 빚어낸 3년의 교리 교육과 닫힌 예배에서 찾는다. 그리고 콘스탄티누스와 아우구스티누스에게서 인내가 '정당한 조급증'으로 변질되는 순간을 추적한다 — 오늘의 성장 지표 문화를 정면으로 되묻는 책이다."><meta property="og:title" content="초기 교회와 인내의 발효 — 앨런 크라이더"><meta property="og:type" content="article"><meta property="og:url" content="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/초기교회의인내와발효_크라이더/"><meta property="og:description" content="처음 3세기 교회는 선교 전략도, 전도 논문 한 편도, 이름이 알려진 선교사도 거의 없이 10년마다 40퍼센트씩 자랐다. 크라이더는 그 비밀을 '인내'라는 덕과 몸에 밴 습관(아비투스), 그것을 빚어낸 3년의 교리 교육과 닫힌 예배에서 찾는다. 그리고 콘스탄티누스와 아우구스티누스에게서 인내가 '정당한 조급증'으로 변질되는 순간을 추적한다 — 오늘의 성장 지표 문화를 정면으로 되묻는 책이다."><meta property="og:site_name" content="영닥터 아카이브"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="초기 교회와 인내의 발효 — 앨런 크라이더"><meta name="twitter:description" content="처음 3세기 교회는 선교 전략도, 전도 논문 한 편도, 이름이 알려진 선교사도 거의 없이 10년마다 40퍼센트씩 자랐다. 크라이더는 그 비밀을 '인내'라는 덕과 몸에 밴 습관(아비투스), 그것을 빚어낸 3년의 교리 교육과 닫힌 예배에서 찾는다. 그리고 콘스탄티누스와 아우구스티누스에게서 인내가 '정당한 조급증'으로 변질되는 순간을 추적한다 — 오늘의 성장 지표 문화를 정면으로 되묻는 책이다."><meta http-equiv="refresh" content="0;url=https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/초기교회의인내와발효_크라이더/"><link rel="canonical" href="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/초기교회의인내와발효_크라이더/"></head><body><a href="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/초기교회의인내와발효_크라이더/">Redirecting…</a></body></html>
