<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>평일의 예배, 노동 — 근무시간도 예배시간이다</title><meta name="description" content="노동은 조직신학이 비워 둔 자리다. 그런데 성경은 창세기 첫 줄의 일하시는 하나님으로 시작해 요한계시록의 새 창조를 하는 일꾼 하나님으로 끝난다. 신약학자인 저자는 이 간극을 본문 주해와 개념 구분으로 메운다. 소명은 재능이 아니고, 재능은 직업이 아니며, 직업은 노동이 아니다 — 이 네 층위를 갈라 놓는 순간 「내 직업이 소명인가」라는 답 없는 물음이 답할 수 있는 물음으로 바뀐다. 그리고 이사야의 종말 환상에는 노동이 멈추는 장면이 없다."><meta property="og:title" content="평일의 예배, 노동 — 근무시간도 예배시간이다"><meta property="og:type" content="article"><meta property="og:url" content="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/평일의예배노동_벤위더링턴3세/"><meta property="og:description" content="노동은 조직신학이 비워 둔 자리다. 그런데 성경은 창세기 첫 줄의 일하시는 하나님으로 시작해 요한계시록의 새 창조를 하는 일꾼 하나님으로 끝난다. 신약학자인 저자는 이 간극을 본문 주해와 개념 구분으로 메운다. 소명은 재능이 아니고, 재능은 직업이 아니며, 직업은 노동이 아니다 — 이 네 층위를 갈라 놓는 순간 「내 직업이 소명인가」라는 답 없는 물음이 답할 수 있는 물음으로 바뀐다. 그리고 이사야의 종말 환상에는 노동이 멈추는 장면이 없다."><meta property="og:site_name" content="영닥터 아카이브"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="평일의 예배, 노동 — 근무시간도 예배시간이다"><meta name="twitter:description" content="노동은 조직신학이 비워 둔 자리다. 그런데 성경은 창세기 첫 줄의 일하시는 하나님으로 시작해 요한계시록의 새 창조를 하는 일꾼 하나님으로 끝난다. 신약학자인 저자는 이 간극을 본문 주해와 개념 구분으로 메운다. 소명은 재능이 아니고, 재능은 직업이 아니며, 직업은 노동이 아니다 — 이 네 층위를 갈라 놓는 순간 「내 직업이 소명인가」라는 답 없는 물음이 답할 수 있는 물음으로 바뀐다. 그리고 이사야의 종말 환상에는 노동이 멈추는 장면이 없다."><meta http-equiv="refresh" content="0;url=https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/평일의예배노동_벤위더링턴3세/"><link rel="canonical" href="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/평일의예배노동_벤위더링턴3세/"></head><body><a href="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/평일의예배노동_벤위더링턴3세/">Redirecting…</a></body></html>
