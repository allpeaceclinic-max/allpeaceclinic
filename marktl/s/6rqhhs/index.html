<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>아픔·상담·치유 — 교회는 왜 치유를 잃었고, 무엇으로 되찾는가</title><meta name="description" content="의사를 찾는 환자의 절반 이상이 몸과 함께 영의 병을 앓는다. 그런데 교회는 영지주의에서 실존주의까지 이천 년에 걸쳐 치유를 목회 밖으로 밀어냈다. 한국 목회상담 1세대 정태기는 한(恨)과 한풀이, 꿈, 설교, 그리고 신학과 심리학의 대화를 통해 그 자리를 되찾으려 한다 — 결론은 신학·심리학·의학이 함께 서야 사람이 온전해진다는 것이다."><meta property="og:title" content="아픔·상담·치유 — 교회는 왜 치유를 잃었고, 무엇으로 되찾는가"><meta property="og:type" content="article"><meta property="og:url" content="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/아픔상담치유_정태기/"><meta property="og:description" content="의사를 찾는 환자의 절반 이상이 몸과 함께 영의 병을 앓는다. 그런데 교회는 영지주의에서 실존주의까지 이천 년에 걸쳐 치유를 목회 밖으로 밀어냈다. 한국 목회상담 1세대 정태기는 한(恨)과 한풀이, 꿈, 설교, 그리고 신학과 심리학의 대화를 통해 그 자리를 되찾으려 한다 — 결론은 신학·심리학·의학이 함께 서야 사람이 온전해진다는 것이다."><meta property="og:site_name" content="영닥터 아카이브"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="아픔·상담·치유 — 교회는 왜 치유를 잃었고, 무엇으로 되찾는가"><meta name="twitter:description" content="의사를 찾는 환자의 절반 이상이 몸과 함께 영의 병을 앓는다. 그런데 교회는 영지주의에서 실존주의까지 이천 년에 걸쳐 치유를 목회 밖으로 밀어냈다. 한국 목회상담 1세대 정태기는 한(恨)과 한풀이, 꿈, 설교, 그리고 신학과 심리학의 대화를 통해 그 자리를 되찾으려 한다 — 결론은 신학·심리학·의학이 함께 서야 사람이 온전해진다는 것이다."><meta http-equiv="refresh" content="0;url=https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/아픔상담치유_정태기/"><link rel="canonical" href="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/아픔상담치유_정태기/"></head><body><a href="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/아픔상담치유_정태기/">Redirecting…</a></body></html>
