<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>환대 (Hospitality, φιλοξενία)</title><meta name="description" content="필록세니아(φιλοξενία)는 '낯선 자를 사랑하는 것'이다. 이미 아는 사람을 대접하는 접대와 근본이 다르다. 돌아올 것을 계산하지 않고 문을 여는 행위, 성경이 명령이라 부른 그것이다. 아브라함의 장막과 베드로가 들어선 고넬료의 집, 라브리의 식탁과 오만의 사흘 규칙, 그리고 오늘의 진료실을 같은 질문 위에 놓는다 — 나와 다른 사람 앞에서 문을 열 것인가, 닫을 것인가. 환대하는 자가 오히려 변한다는 역설이 이 글의 끝자리다."><meta property="og:title" content="환대 (Hospitality, φιλοξενία)"><meta property="og:type" content="article"><meta property="og:url" content="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/환대/"><meta property="og:description" content="필록세니아(φιλοξενία)는 '낯선 자를 사랑하는 것'이다. 이미 아는 사람을 대접하는 접대와 근본이 다르다. 돌아올 것을 계산하지 않고 문을 여는 행위, 성경이 명령이라 부른 그것이다. 아브라함의 장막과 베드로가 들어선 고넬료의 집, 라브리의 식탁과 오만의 사흘 규칙, 그리고 오늘의 진료실을 같은 질문 위에 놓는다 — 나와 다른 사람 앞에서 문을 열 것인가, 닫을 것인가. 환대하는 자가 오히려 변한다는 역설이 이 글의 끝자리다."><meta property="og:site_name" content="영닥터 아카이브"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="환대 (Hospitality, φιλοξενία)"><meta name="twitter:description" content="필록세니아(φιλοξενία)는 '낯선 자를 사랑하는 것'이다. 이미 아는 사람을 대접하는 접대와 근본이 다르다. 돌아올 것을 계산하지 않고 문을 여는 행위, 성경이 명령이라 부른 그것이다. 아브라함의 장막과 베드로가 들어선 고넬료의 집, 라브리의 식탁과 오만의 사흘 규칙, 그리고 오늘의 진료실을 같은 질문 위에 놓는다 — 나와 다른 사람 앞에서 문을 열 것인가, 닫을 것인가. 환대하는 자가 오히려 변한다는 역설이 이 글의 끝자리다."><meta http-equiv="refresh" content="0;url=https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/환대/"><link rel="canonical" href="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/환대/"></head><body><a href="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/환대/">Redirecting…</a></body></html>
