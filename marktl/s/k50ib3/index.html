<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>의와 공도, 그 둘은 무엇이 다릅니까 (하백선 5장 — Integrity as Mission)</title><meta name="description" content="창세기 18장 19절은 「의와 공도를 행하게 하려고」라고 말한다. 그런데 의와 공도가 뭐가 다른가 — 대개 대답하지 못한다. 우리말로는 둘 다 '옳고 바른 것'으로 뭉뚱그려 들리기 때문이다. 원문은 전혀 다른 두 가지 일을 말한다. 하나는 내가 바르게 서는 것이고, 하나는 굽은 것을 바로 세우러 나서는 것이다. 저자 크리스토퍼 라이트가 눈 내리는 공원을 걸으며 이 책을 구상할 때 가장 먼저 붙잡은 본문이 바로 이 구절이었다."><meta property="og:title" content="의와 공도, 그 둘은 무엇이 다릅니까 (하백선 5장 — Integrity as Mission)"><meta property="og:type" content="article"><meta property="og:url" content="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/램스_하백선5장_발행본/"><meta property="og:description" content="창세기 18장 19절은 「의와 공도를 행하게 하려고」라고 말한다. 그런데 의와 공도가 뭐가 다른가 — 대개 대답하지 못한다. 우리말로는 둘 다 '옳고 바른 것'으로 뭉뚱그려 들리기 때문이다. 원문은 전혀 다른 두 가지 일을 말한다. 하나는 내가 바르게 서는 것이고, 하나는 굽은 것을 바로 세우러 나서는 것이다. 저자 크리스토퍼 라이트가 눈 내리는 공원을 걸으며 이 책을 구상할 때 가장 먼저 붙잡은 본문이 바로 이 구절이었다."><meta property="og:site_name" content="영닥터 아카이브"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="의와 공도, 그 둘은 무엇이 다릅니까 (하백선 5장 — Integrity as Mission)"><meta name="twitter:description" content="창세기 18장 19절은 「의와 공도를 행하게 하려고」라고 말한다. 그런데 의와 공도가 뭐가 다른가 — 대개 대답하지 못한다. 우리말로는 둘 다 '옳고 바른 것'으로 뭉뚱그려 들리기 때문이다. 원문은 전혀 다른 두 가지 일을 말한다. 하나는 내가 바르게 서는 것이고, 하나는 굽은 것을 바로 세우러 나서는 것이다. 저자 크리스토퍼 라이트가 눈 내리는 공원을 걸으며 이 책을 구상할 때 가장 먼저 붙잡은 본문이 바로 이 구절이었다."><meta http-equiv="refresh" content="0;url=https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/램스_하백선5장_발행본/"><link rel="canonical" href="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/램스_하백선5장_발행본/"></head><body><a href="https://allpeaceclinic-max.github.io/allpeaceclinic/marktl/램스_하백선5장_발행본/">Redirecting…</a></body></html>
