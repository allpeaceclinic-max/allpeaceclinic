<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>마음을 여는 경청기술 — 지도자는 왜 듣지 않는가</title><meta name="description" content="지도자들은 듣기가 시간이 걸리고, 약해 보이게 하고, 동의한 것으로 오해받을까 두려워한다. 이 책은 그 두려움을 정면으로 다루며, 듣기가 우유부단이 아니라 사람을 소중히 여긴다는 것을 몸으로 보여 주는 리더십의 핵심 기술임을 보여 준다. 관심·이해·존중의 능동적 듣기에서 지도자의 네 기질, 교회의 네 유형까지 — 말하기보다 듣기를 속히 하라는 야고보서 한 구절을 리더십의 언어로 풀었다."><meta property="og:title" content="마음을 여는 경청기술 — 지도자는 왜 듣지 않는가"><meta property="og:type" content="article"><meta property="og:url" content="https://wiki.youngdoctor.kr/marktl/마음을여는경청기술_데이브핑/"><meta property="og:description" content="지도자들은 듣기가 시간이 걸리고, 약해 보이게 하고, 동의한 것으로 오해받을까 두려워한다. 이 책은 그 두려움을 정면으로 다루며, 듣기가 우유부단이 아니라 사람을 소중히 여긴다는 것을 몸으로 보여 주는 리더십의 핵심 기술임을 보여 준다. 관심·이해·존중의 능동적 듣기에서 지도자의 네 기질, 교회의 네 유형까지 — 말하기보다 듣기를 속히 하라는 야고보서 한 구절을 리더십의 언어로 풀었다."><meta property="og:site_name" content="영닥터 아카이브"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="마음을 여는 경청기술 — 지도자는 왜 듣지 않는가"><meta name="twitter:description" content="지도자들은 듣기가 시간이 걸리고, 약해 보이게 하고, 동의한 것으로 오해받을까 두려워한다. 이 책은 그 두려움을 정면으로 다루며, 듣기가 우유부단이 아니라 사람을 소중히 여긴다는 것을 몸으로 보여 주는 리더십의 핵심 기술임을 보여 준다. 관심·이해·존중의 능동적 듣기에서 지도자의 네 기질, 교회의 네 유형까지 — 말하기보다 듣기를 속히 하라는 야고보서 한 구절을 리더십의 언어로 풀었다."><meta http-equiv="refresh" content="0;url=https://wiki.youngdoctor.kr/marktl/마음을여는경청기술_데이브핑/"><link rel="canonical" href="https://wiki.youngdoctor.kr/marktl/마음을여는경청기술_데이브핑/"></head><body><a href="https://wiki.youngdoctor.kr/marktl/마음을여는경청기술_데이브핑/">Redirecting…</a></body></html>
